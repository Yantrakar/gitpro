[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gitpro"
dynamic = ["version"]
description = "Per-remote git identities (name, email, SSH key, commit signing) from one TOML file"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sandeep Shelke" }]
requires-python = ">=3.9"
dependencies = ['tomli>=1.1; python_version < "3.11"', "rich>=13"]
keywords = ["git", "ssh", "identity", "gitconfig", "includeif", "signing"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]  # interactive scan --fix

[project.urls]
Homepage = "https://github.com/sandeepshelke/gitpro"

[project.scripts]
gitpro = "gitpro.cli:main"

[tool.hatch.version]
path = "src/gitpro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gitpro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
