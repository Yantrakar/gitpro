name: Release

# Run by hand on main ("Run workflow", or scripts/release.py), never by a tag:
# the version in src/gitpro/VERSION (the only place the version is written)
# must be X.Y.Z, and tag vX.Y.Z must not exist yet; the VSIX and server.json
# are stamped with it at build time. The full CI
# matrix runs first; one build then feeds GitHub (which creates the tag),
# PyPI, the Marketplace and Open VSX; server.json goes to the MCP Registry
# once PyPI has the release. site/ goes to gitpro.dev last, once every channel
# has it. Each publishing job waits for its environment's reviewer.
# Spec: docs/spec/20-release.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Runs on main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The version is X.Y.Z
        id: version
        run: |
          v=$(python3 scripts/versions.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: The tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>err; then
            echo "tag $TAG already exists"; exit 1
          fi
          grep -q "HTTP 404" err || { cat err; exit 1; }

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install build
      - run: python -m build --outdir dist .
      - run: python tests/smoke_wheel.py dist/*.whl
      - name: VS Code extension
        working-directory: vscode
        run: |
          npm ci
          npm test
          python3 ../scripts/versions.py --stamp
          npx vsce package --out ../dist/
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # A tag made with the job's own token starts no other workflow. Re-running a failed job must
      # not fail on what the first attempt already did: a tag at this commit and a release are kept.
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object | .type + " " + .sha' >ref 2>err; then
            read -r type sha < ref
            if [ "$type" = tag ]; then
              sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
            fi
            if [ "$sha" = "$GITHUB_SHA" ]; then
              echo "tag $TAG already points at $GITHUB_SHA"; exit 0
            fi
            echo "tag $TAG exists at $sha, not at $GITHUB_SHA"; exit 1
          fi
          grep -q "HTTP 404" err || { cat err; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="gitpro $VERSION" \
                -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" --silent
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>err; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            grep -q "release not found" err || { cat err; exit 1; }
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi

  pypi:
    needs: github
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gitpro/
    permissions:
      id-token: write  # trusted publishing; no token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm dist/*.vsix dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  marketplace:
    needs: [check, github]
    uses: ./.github/workflows/marketplace.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    permissions:
      contents: read
      id-token: write

  # Open VSX trusts this file and the openvsx environment as a trusted publisher, so no token is
  # stored; it matches the run's top workflow, release.yml, not a file it calls. Off until the
  # repository variable OPENVSX is true. --skip-duplicate keeps a re-run from failing.
  openvsx:
    needs: github
    if: vars.OPENVSX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: openvsx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes ovsx@1.2.0 publish --packagePath dist/*.vsix --trusted-publishing --skip-duplicate

  mcp-registry:
    needs: [check, pypi]
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    permissions:
      contents: read
      id-token: write

  # The announcement goes last: gitpro.dev names the version only once every channel has it.
  # A channel that is off (marketplace without the Azure variables, openvsx without OPENVSX)
  # is skipped and doesn't hold the site back; a failed, rejected or cancelled job does.
  site:
    needs: [pypi, marketplace, openvsx, mcp-registry]
    if: ${{ !cancelled() && !failure() && needs.pypi.result == 'success' && needs.mcp-registry.result == 'success' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
