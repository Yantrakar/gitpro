name: Release

# Push a tag vX.Y.Z whose version matches src/gitpro/__init__.py and
# vscode/package.json. One build feeds GitHub, PyPI and the Marketplace.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches the versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/gitpro/__init__.py").read_text())[1])')
          js=$(node -p 'require("./vscode/package.json").version')
          echo "tag=$tag python=$py vscode=$js"
          test "$tag" = "$py" && test "$tag" = "$js"
      - run: pip install -e . pytest build
      - run: pytest -q
      - run: python -m build --outdir dist .
      - run: python tests/smoke_wheel.py dist/*.whl
      - name: VS Code extension
        working-directory: vscode
        run: |
          npm ci
          npm test
          npx vsce package --out ../dist/
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gitpro/
    permissions:
      id-token: write  # trusted publishing; no token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm dist/*.vsix dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1

  marketplace:
    needs: github
    uses: ./.github/workflows/marketplace.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
