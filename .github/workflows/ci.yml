name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - run: pip install -e . pytest
      - run: pytest -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python tests/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m venv ../.venv
          ../.venv/bin/python -m pip install -e ..
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a npm run test:integration
      - run: npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode/*.vsix
          if-no-files-found: error
