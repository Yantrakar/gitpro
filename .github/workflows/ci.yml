name: CI

# Runs before a PR is accepted, once per push to it; a newer push cancels the
# older run. Main is not tested again after the merge, and a release tag is
# tested by release.yml's build. It can also be run by hand on any branch, or
# called by another workflow; such a run has a group of its own (its run ID,
# or the caller's), so it never cancels a PR run and is never cancelled by one.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - run: pip install -e . pytest pytest-xdist
      - run: pytest -v -n auto --dist worksteal
      - run: python tests/smoke_providers.py
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python tests/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m venv ../.venv
          ../.venv/bin/python -m pip install -e ..
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a npm run test:integration
      - run: python3 ../scripts/versions.py --stamp
      - run: npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode/*.vsix
          if-no-files-found: error
          retention-days: 7
