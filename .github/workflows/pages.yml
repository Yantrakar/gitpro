# Publishes site/ to GitHub Pages (https://gitpro.dev). The release workflow
# calls it at a release tag once the same version is on PyPI, so the site never
# names a version that cannot be installed. A merge to main does not publish.
# Run it by hand on main to publish a site-only fix between releases.
name: pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # site_meta.py dates the sitemap from git history
      - run: python3 design/site_meta.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
